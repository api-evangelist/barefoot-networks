name: Barefoot Networks
description: Barefoot Networks was a computer-networking company founded in 2013 in
  Santa Clara, California, that designed and produced programmable network-switch silicon,
  systems, and software. Its flagship Tofino Intelligent Fabric Processor was the first
  end-user-programmable Ethernet switch ASIC, built on the Protocol Independent Switch
  Architecture (PISA) and programmed with the P4 language at line rates up to 12.8 Tbit/s.
  Developer tooling spanned the P4 Studio SDK, the Barefoot Runtime Interface (BRI)
  control-plane API, and the Tofino Native Architecture (TNA). Intel acquired Barefoot
  Networks in June 2019, folding the technology into Intel Tofino / Intel Intelligent
  Fabric Processors; the barefootnetworks.com corporate site now redirects into Intel,
  and the surviving open documentation lives in the barefootnetworks GitHub organization
  (notably the Open-Tofino repository publishing the public TNA and P4 architecture docs).
